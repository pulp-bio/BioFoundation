data_module:
  _target_: 'data_module.finetuning_data_module.FinetuningDataModule'
  name: "eeg"
  cfg:
    num_workers: ${num_workers}
    batch_size: ${batch_size}

  # Splits are fixed by the preprocessing step, not resampled here. Point dataset_root
  # at another prepared corpus to fine-tune on it; see docs/model/SCEReBrO.md for the
  # channel count, window length and class count each one expects.
  train:
    _target_: 'datasets.lmdb_dataset.LMDBDataset'
    path: ${dataset_root}
    split: train
    dataset_kind: ${dataset_kind}
    apply_minmax: True
    apply_zero_padding: False
    label_mode: ${label_mode}
    use_cache: False
  val:
    _target_: 'datasets.lmdb_dataset.LMDBDataset'
    path: ${dataset_root}
    split: val
    dataset_kind: ${dataset_kind}
    apply_minmax: True
    apply_zero_padding: False
    label_mode: ${label_mode}
    use_cache: False
  test:
    _target_: 'datasets.lmdb_dataset.LMDBDataset'
    path: ${dataset_root}
    split: test
    dataset_kind: ${dataset_kind}
    apply_minmax: True
    apply_zero_padding: False
    label_mode: ${label_mode}
    use_cache: False
