data_module:
  _target_: 'data_module.pretraining_data_module.PretrainingDataModule'
  name: "eeg"
  cfg:
    num_workers: ${num_workers}
    batch_size: ${batch_size}

  # Held-out fraction and the seed that fixes the split. run_train.py instantiates the
  # data module without arguments, so the seed is threaded through the config rather
  # than passed at call time; every rank therefore derives the same split.
  val_ratio: 0.2
  seed: ${seed}

  # Corpora are concatenated. Set a corpus to null to drop it from a run.
  train:
    TUEG:
      _target_: 'datasets.tueg_dataset.TUEGDataset'
      lmdb_path: '${env:DATA_PATH}/pretraining/TUEG/TUEG.lmdb'
      keys_path: '${env:DATA_PATH}/pretraining/TUEG/TUEG_keys.txt'
      max_channels: ${model.max_channels}
      sampling_freq: 200
      slice_duration: 30
      use_cache: False
    SEED:
      _target_: 'datasets.lmdb_dataset.LMDBDataset'
      path: '${env:DATA_PATH}/pretraining/SEED/'
      dataset_kind: window
      apply_minmax: True
      apply_zero_padding: True
      max_channels: ${model.max_channels}
      max_timesteps: ${model.max_timesteps}
      use_cache: False
    SEED-IV:
      _target_: 'datasets.lmdb_dataset.LMDBDataset'
      path: '${env:DATA_PATH}/pretraining/SEED-IV/'
      dataset_kind: window
      apply_minmax: True
      apply_zero_padding: True
      max_channels: ${model.max_channels}
      max_timesteps: ${model.max_timesteps}
      use_cache: False
    SEED-GER:
      _target_: 'datasets.lmdb_dataset.LMDBDataset'
      path: '${env:DATA_PATH}/pretraining/SEED-GER/'
      dataset_kind: window
      apply_minmax: True
      apply_zero_padding: True
      max_channels: ${model.max_channels}
      max_timesteps: ${model.max_timesteps}
      use_cache: False
    SEED-FRA:
      _target_: 'datasets.lmdb_dataset.LMDBDataset'
      path: '${env:DATA_PATH}/pretraining/SEED-FRA/'
      dataset_kind: window
      apply_minmax: True
      apply_zero_padding: True
      max_channels: ${model.max_channels}
      max_timesteps: ${model.max_timesteps}
      use_cache: False
    BOAS:
      _target_: 'datasets.lmdb_dataset.LMDBDataset'
      path: '${env:DATA_PATH}/pretraining/BOAS/'
      dataset_kind: window
      apply_minmax: True
      apply_zero_padding: True
      max_channels: ${model.max_channels}
      max_timesteps: ${model.max_timesteps}
      use_cache: False
    GWD:
      _target_: 'datasets.lmdb_dataset.LMDBDataset'
      path: '${env:DATA_PATH}/pretraining/GWD/'
      dataset_kind: window
      apply_minmax: True
      apply_zero_padding: True
      max_channels: ${model.max_channels}
      max_timesteps: ${model.max_timesteps}
      use_cache: False
    SleepEDFx:
      _target_: 'datasets.lmdb_dataset.LMDBDataset'
      path: '${env:DATA_PATH}/pretraining/SleepEDFx/'
      dataset_kind: window
      apply_minmax: True
      apply_zero_padding: True
      max_channels: ${model.max_channels}
      max_timesteps: ${model.max_timesteps}
      use_cache: False
    BCI-NER:
      _target_: 'datasets.lmdb_dataset.LMDBDataset'
      path: '${env:DATA_PATH}/pretraining/BCI-NER/'
      dataset_kind: window
      apply_minmax: True
      apply_zero_padding: True
      max_channels: ${model.max_channels}
      max_timesteps: ${model.max_timesteps}
      use_cache: False
