# ISRUC: sleep staging. 6 channels, sequences of 20 consecutive 30 s epochs, 5 classes
# per epoch. The sequence axis is folded into the batch by the task and restored by the
# head, so the encoder still sees one epoch at a time.
defaults:
  - /model_head: sequence_classification_head
  - override /task: finetune_task_SCEReBrO
  - override /criterion: ce_criterion

dataset_root: ${env:DATA_PATH}/finetuning/ISRUC
dataset_kind: sequence
label_mode: classification

model:
  num_channels: 6

model_head:
  num_classes: 5
  num_patches: 30
  sequence_length: 20
