# SEED-VIG: vigilance regression. 17 channels, 8 s windows, continuous target in [0, 1].
# MlpRegressionHead takes neither num_classes nor num_patches, so neither is set here.
defaults:
  - /model_head: mlp_regression_head
  - override /task: finetune_regression_task_SCEReBrO
  - override /criterion: mse_criterion

dataset_root: ${env:DATA_PATH}/finetuning/SEED-VIG
dataset_kind: window
label_mode: regression

model:
  num_channels: 17

model_head:
  # PERCLOS is bounded, so the head keeps its sigmoid. Disable for unbounded targets.
  bounded_output: True
