# STEW: workload. 14 channels, 4 s windows, 3 classes.
defaults:
  - /model_head: mlp_classification_head
  - override /task: finetune_task_SCEReBrO
  - override /criterion: ce_criterion

dataset_root: ${env:DATA_PATH}/finetuning/STEW
dataset_kind: window
label_mode: classification

model:
  num_channels: 14

model_head:
  num_classes: 3
  # One patch per second. Only read when pooling_method is 'flatten'; mean pooling
  # takes the window length from the data.
  num_patches: 4
