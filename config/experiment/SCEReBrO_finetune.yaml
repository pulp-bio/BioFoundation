tag: SCEReBrO_finetune
model_size: tiny

# Names the registry entry whose BatchRequirements the task enforces on every batch.
model_family: s-cerebro

# Fine-tuning dataset. Defaults to TUAB; switch corpus with a single override, e.g.
#   python -u run_train.py +experiment=SCEReBrO_finetune \
#       dataset_root=${env:DATA_PATH}/finetuning/CHB-MIT model.num_channels=16
# docs/model/SCEReBrO.md lists the channel count, window length and class count for
# each prepared dataset.
dataset_root: ${env:DATA_PATH}/finetuning/TUAB
dataset_kind: window          # 'window', or 'sequence' for ISRUC sleep staging
label_mode: classification

gpus: -1
num_nodes: 1
num_workers: 4
batch_size: 64

seed: 0
training: True
resume: False
final_validate: True
final_test: True
find_unused_parameters: False

pretrained_checkpoint_path: null
pretrained_safetensors_path: null

defaults:
  # model_head is not part of the global defaults, so it is added here rather than
  # overridden, leaving the composition of the five bundled families untouched.
  # Hydra requires additions before overrides in a defaults list.
  #
  # For SEED-VIG vigilance regression, change these together on the command line
  # (no leading slash in CLI overrides):
  #   model_head=mlp_regression_head task=finetune_regression_task_SCEReBrO \
  #   criterion=mse_criterion label_mode=regression
  - /model_head: mlp_classification_head
  - override /data_module: finetune_data_module_SCEReBrO
  - override /model: SCEReBrO_tiny        # or SCEReBrO_small, SCEReBrO_base
  - override /task: finetune_task_SCEReBrO
  - override /criterion: ce_criterion
  - override /scheduler: cosine

model:
  num_channels: 22          # TUAB montage

# model_head values are not set here. Each head config in config/model_head/ carries
# its own defaults, so swapping the head group does not leave classification-only keys
# such as num_classes behind for a head that does not accept them. Override per
# dataset on the command line, e.g. model_head.num_classes=4 model_head.num_patches=4.

task:
  freeze_backbone: False    # True gives a linear-probe style run
  layerwise_lr_decay: 0.95

io:
  checkpoint_dirpath: ${env:CHECKPOINT_DIR}/checkpoints
  base_output_path: ${env:CHECKPOINT_DIR}/outputs
  version: ${tag}_${model_size}

callbacks:
  lr_monitor:
    _target_: 'pytorch_lightning.callbacks.LearningRateMonitor'
    logging_interval: step
  progress_bar:
    _target_: 'pytorch_lightning.callbacks.TQDMProgressBar'
    refresh_rate: 50
  early_stopping:
    _target_: 'pytorch_lightning.callbacks.EarlyStopping'
    monitor: 'val_loss'
    patience: 35
    mode: 'min'
    verbose: True

model_checkpoint:
  save_last: True
  monitor: "val_loss"
  mode: "min"
  save_top_k: 1
  every_n_epochs: 1

trainer:
  accelerator: gpu
  num_nodes: ${num_nodes}
  devices: ${gpus}
  strategy: ddp
  max_epochs: 50
  gradient_clip_val: 1
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1

optimizer:
  optim: AdamW
  lr: 1e-4
  betas: [0.9, 0.999]
  weight_decay: 0.05

scheduler:
  trainer: ${trainer}
  warmup_epochs: 5
  min_lr: 1e-5
  warmup_lr_init: 1e-5
