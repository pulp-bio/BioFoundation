tag: SCEReBrO_finetune

# model_size is supplied by the selected config/model group, so it always matches
# the encoder actually being built.

# Where snapshot_download placed the Hugging Face release. Kept separate from the
# checkpoint path so a run can point at one file without restating the root:
#   pretrained_safetensors_path='${pretrained_root}/SCEReBrO_${model_size}.safetensors'
pretrained_root: ${env:CHECKPOINT_DIR}/pretrained/S-CEReBrO

# Names the registry entry whose BatchRequirements the task enforces on every batch.
model_family: s-cerebro

# The corpus is selected as a single config group. Each file in config/dataset/ owns
# everything that varies per corpus: its path, whether samples are windows or
# sequences, whether labels are classes or a continuous target, the channel count, and
# the matching prediction head, task and criterion. Switch corpus with one override:
#   python -u run_train.py +experiment=SCEReBrO_finetune dataset=isruc

gpus: -1
num_nodes: 1
num_workers: 4
batch_size: 64

seed: 0
training: True
resume: False
final_validate: True
final_test: True
find_unused_parameters: False

pretrained_checkpoint_path: null
pretrained_safetensors_path: null

# Normalisation for S-CEReBrO is min-max to [-1, 1], applied per channel by
# LMDBDataset via apply_minmax and written into TUEG offline by make_tueg. The
# quantile normalisation that config/defaults.yaml configures belongs to the tasks the
# bundled families use; the S-CEReBrO tasks never read input_normalization. It is
# disabled here so the resolved config cannot be misread as enabling it.
input_normalization:
  normalize: False

defaults:
  # The dataset group brings its own model_head, task and criterion, so this experiment
  # deliberately does not select them. Hydra applies a config's own values after its
  # defaults list, so anything set here would win over the group and the two could
  # disagree; leaving them to config/dataset/ makes one file the single owner.
  #
  # model_head is not in the global defaults, so the dataset group adds it rather than
  # overriding it, which leaves the five bundled families composing exactly as before.
  # Hydra requires additions before overrides in a defaults list.
  - /dataset: tuab
  - override /data_module: finetune_data_module_SCEReBrO
  - override /model: SCEReBrO_tiny        # or SCEReBrO_small, SCEReBrO_base
  - override /scheduler: cosine

task:
  freeze_backbone: False    # True gives a linear-probe style run
  layerwise_lr_decay: 0.95

io:
  checkpoint_dirpath: ${env:CHECKPOINT_DIR}/checkpoints
  base_output_path: ${env:CHECKPOINT_DIR}/outputs
  version: ${tag}_${model_size}

callbacks:
  lr_monitor:
    _target_: 'pytorch_lightning.callbacks.LearningRateMonitor'
    logging_interval: step
  progress_bar:
    _target_: 'pytorch_lightning.callbacks.TQDMProgressBar'
    refresh_rate: 50
  early_stopping:
    _target_: 'pytorch_lightning.callbacks.EarlyStopping'
    monitor: 'val_loss'
    patience: 35
    mode: 'min'
    verbose: True

model_checkpoint:
  save_last: True
  monitor: "val_loss"
  mode: "min"
  save_top_k: 1
  every_n_epochs: 1

trainer:
  accelerator: gpu
  num_nodes: ${num_nodes}
  devices: ${gpus}
  strategy: ddp
  max_epochs: 50
  gradient_clip_val: 1
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1

optimizer:
  optim: AdamW
  lr: 1e-4
  betas: [0.9, 0.999]
  weight_decay: 0.05

scheduler:
  trainer: ${trainer}
  warmup_epochs: 5
  min_lr: 1e-5
  warmup_lr_init: 1e-5
