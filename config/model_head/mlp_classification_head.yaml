model_head:
  _target_: models.model_heads.mlp_classification_head.MlpClassificationHead
  embed_dim: ${model.embed_dim}
  num_classes: 2            # override per fine-tuning dataset
  pooling_method: mean      # 'mean' or 'flatten'
  dropout: 0.1
  pooling: True
  num_channels: ${model.num_channels}
  num_patches: 10           # window length in seconds; only read by 'flatten'
